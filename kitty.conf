# ---------- Remote Control ----------
allow_remote_control yes
# ---------- Remote Control ----------

# ---------- Theme ----------
include colors.conf
dynamic_background_opacity true
# ---------- Theme ----------

# ---------- Style ----------
cursor_shape block
window_padding_width 20
scrollbar_handle_opacity 0
scrollbar_track_opacity 0
scrollbar_track_hover_opacity 0
# ---------- Style ----------

# ---------- Fonts ----------
font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12
disable_ligatures never
# ---------- Fonts ----------

# ---------- Cursor & Shell ----------
scrollback_lines 10000
cursor_blink_interval 0.5
cursor_underline_thickness 4.0
cursor_stop_blinking_after 2.0
copy_on_select yes

# Cursor trail
cursor_trail 10
cursor_trail_decay 0.15 0.4
cursor_trail_start_threshold 2

linux_display_server wayland
shell_integration enabled
# ---------- Cursor & Shell ----------


# ---------- Window ----------
hide_window_decorations yes
background_opacity 0.9
confirm_os_window_close 0
input_delay 0
# ---------- Window ----------


# ---------- Tabs ----------
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_activity_symbol ⚡

active_tab_font_style bold
inactive_tab_font_style normal
# ---------- Tabs ----------

# ---------- Keybindings ----------
# Disable default shortcuts
map ctrl+shift+t no_op
map ctrl+shift+q no_op
map ctrl+shift+enter no_op
map ctrl+shift+w no_op
map ctrl+shift+] no_op
map ctrl+shift+[ no_op

# Clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Font Size
map ctrl+shift+equal change_font_size all +2.0
map ctrl+shift+minus change_font_size all -2.0
map ctrl+shift+backspace change_font_size all 0
# ---------- Keybindings ----------
